<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Trading App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0a0a0a;
      font-family: 'Inter', sans-serif;
    }
    #root {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .phone-frame {
      width: 390px;
      height: 844px;
      border-radius: 40px;
      overflow: hidden;
      background: #000000;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 30px 80px rgba(0,0,0,0.9),
        0 10px 30px rgba(0,0,0,0.7);
      position: relative;
    }
    /* Splash Phase */
    .splash-screen {
      position: absolute;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 36px;
      transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
      z-index: 10;
    }
    .splash-screen.exiting {
      opacity: 0;
      transform: scale(0.95);
    }
    .splash-title {
      font-size: 42px;
      font-weight: 800;
      color: #FFFFFF;
      text-align: center;
      line-height: 1.15;
      letter-spacing: -1.5px;
      flex: 1;
      display: flex;
      align-items: center;
    }
    .splash-buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-login {
      background: transparent;
      border: none;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      padding: 18px;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    .btn-create {
      background: transparent;
      border: 2px solid #FFFFFF;
      border-radius: 100px;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      padding: 18px;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    /* Dashboard Phase */
    .dashboard-screen {
      position: absolute;
      inset: 0;
      background: #000000;
      padding: 56px 24px 0 24px;
      overflow: hidden;
      transition: opacity 0.6s var(--ease);
    }
    .dashboard-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    /* Header */
    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      opacity: 0;
      transition: opacity 0.5s var(--ease);
    }
    .dashboard-header.visible {
      opacity: 1;
    }
    .header-greeting small {
      display: block;
      font-size: 14px;
      color: #8E8E93;
      font-weight: 400;
      margin-bottom: 2px;
    }
    .header-greeting strong {
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .avatar-circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3a3a3c, #636366);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    /* Category Tabs */
    .category-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      opacity: 0;
      transform: translateX(60px);
      transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
    }
    .category-tabs.visible {
      opacity: 1;
      transform: translateX(0);
    }
    .tab-pill {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      border: none;
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }
    .tab-pill.active {
      background: #FFFFFF;
      color: #000000;
    }
    .tab-pill.inactive {
      background: rgba(28,28,30,0.85);
      color: #8E8E93;
    }
    /* Stock Cards */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stock-card {
      background: rgba(28,28,30,0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 32px;
      border: 1px solid rgba(255,255,255,0.07);
      padding: 20px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      transform: translateY(100px);
      transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
      position: relative;
    }
    .stock-card.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .card-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .company-logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .company-info .company-name {
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.2;
    }
    .company-info .company-ticker {
      font-size: 12px;
      color: #8E8E93;
      margin-top: 2px;
    }
    .card-right {
      text-align: right;
    }
    .card-right .price {
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.2;
    }
    .card-right .change-positive {
      font-size: 13px;
      color: #BFFF00;
      margin-top: 2px;
    }
    .card-right .change-negative {
      font-size: 13px;
      color: #FF453A;
      margin-top: 2px;
    }
    .trend-pill {
      position: absolute;
      top: -10px;
      right: 20px;
      background: #BFFF00;
      color: #000000;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 100px;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.4s var(--spring), transform 0.4s var(--spring);
    }
    .trend-pill.visible {
      opacity: 1;
      transform: scale(1);
    }
    /* Invest Button */
    .invest-btn-wrap {
      position: absolute;
      bottom: 100px;
      left: 24px;
      right: 24px;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
    }
    .invest-btn-wrap.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .invest-btn {
      width: 100%;
      background: #FFFFFF;
      border: none;
      border-radius: 100px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .invest-btn-text {
      font-size: 16px;
      font-weight: 800;
      color: #000000;
      letter-spacing: 0.5px;
      padding-left: 8px;
    }
    .invest-btn-arrow {
      width: 38px;
      height: 38px;
      background: #000000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    /* Bottom Nav */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 12px 0 24px 0;
      opacity: 0;
      transition: opacity 0.5s var(--ease);
    }
    .bottom-nav.visible {
      opacity: 1;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .nav-label {
      font-size: 10px;
      font-weight: 500;
    }
    .nav-label.active {
      color: #FFFFFF;
    }
    .nav-label.inactive {
      color: #8E8E93;
    }
    /* Detail Phase */
    .detail-screen {
      position: absolute;
      inset: 0;
      background: #000000;
      overflow-y: hidden;
      overflow-x: hidden;
      opacity: 0;
      transition: opacity 0.6s var(--ease);
    }
    .detail-screen.visible {
      opacity: 1;
    }
    .detail-header-card {
      background: rgba(28,28,30,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom-left-radius: 32px;
      border-bottom-right-radius: 32px;
      padding: 56px 24px 28px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .detail-header-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .detail-company-info {
      flex: 1;
    }
    .detail-company-name {
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .detail-company-sub {
      font-size: 12px;
      color: #8E8E93;
      margin-top: 1px;
    }
    .detail-trend-pill {
      background: #BFFF00;
      color: #000000;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 100px;
      white-space: nowrap;
    }
    .detail-price-center {
      text-align: center;
      margin-top: 8px;
    }
    .detail-price-large {
      font-size: 48px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -2px;
      line-height: 1;
    }
    .detail-price-change {
      font-size: 14px;
      color: #BFFF00;
      margin-top: 6px;
    }
    /* Chart section */
    .detail-body {
      padding: 20px 24px 0 24px;
    }
    .chart-container {
      background: rgba(28,28,30,0.6);
      border-radius: 24px;
      padding: 16px 12px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.05);
      position: relative;
    }
    .chart-clip-wrapper {
      clip-path: inset(0 100% 0 0);
      transition: clip-path 1s var(--ease);
    }
    .chart-clip-wrapper.drawn {
      clip-path: inset(0 0% 0 0);
    }
    .price-indicator-line {
      position: absolute;
      top: 16px;
      bottom: 16px;
      width: 1.5px;
      background: rgba(255,255,255,0.9);
      pointer-events: none;
      transition: none;
    }
    .price-indicator-dot {
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      background: #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 0 8px 3px rgba(255,255,255,0.4);
    }
    /* Timeframe selector */
    .timeframe-wrap {
      opacity: 0;
      transition: opacity 0.4s var(--ease);
      margin-bottom: 16px;
    }
    .timeframe-wrap.visible {
      opacity: 1;
    }
    .timeframe-selector {
      background: rgba(28,28,30,0.85);
      border-radius: 100px;
      padding: 4px;
      display: flex;
      gap: 2px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .tf-btn {
      flex: 1;
      padding: 7px 4px;
      border-radius: 100px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }
    .tf-btn.active {
      background: #FFFFFF;
      color: #000000;
    }
    .tf-btn.inactive {
      background: transparent;
      color: #8E8E93;
    }
    /* Stats row */
    .stats-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      opacity: 0;
      transition: opacity 0.4s var(--ease) 0.2s;
    }
    .stats-row.visible {
      opacity: 1;
    }
    .stat-card {
      flex: 1;
      background: rgba(28,28,30,0.85);
      border-radius: 16px;
      padding: 12px 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .stat-label {
      font-size: 11px;
      color: #8E8E93;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 13px;
      color: #FFFFFF;
      font-weight: 700;
    }
    /* Detail invest button */
    .detail-invest-wrap {
      position: absolute;
      bottom: 32px;
      left: 24px;
      right: 24px;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
    }
    .detail-invest-wrap.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .detail-invest-btn {
      width: 100%;
      background: #FFFFFF;
      border: none;
      border-radius: 100px;
      padding: 20px;
      font-size: 16px;
      font-weight: 800;
      color: #000000;
      letter-spacing: 1.5px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // SVG Logo Components
    function PfizerLogo() {
      return (
        <svg width="36" height="36" viewBox="0 0 36 36" className="company-logo">
          <circle cx="18" cy="18" r="18" fill="#0068A5"/>
          <text x="18" y="23" textAnchor="middle" fill="white" fontSize="11" fontWeight="700" fontFamily="Inter, sans-serif">PFE</text>
        </svg>
      );
    }

    function NikeLogo() {
      return (
        <svg width="36" height="36" viewBox="0 0 36 36" className="company-logo">
          <circle cx="18" cy="18" r="18" fill="#111111"/>
          <path d="M8 21L22 14L26 16L12 23L8 21Z" fill="white"/>
        </svg>
      );
    }

    function EsteeLogo({ size = 36 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 36 36" className="company-logo">
          <circle cx="18" cy="18" r="18" fill="#C9A96E"/>
          <text x="18" y="23" textAnchor="middle" fill="white" fontSize="11" fontWeight="700" fontFamily="Georgia, serif">EL</text>
        </svg>
      );
    }

    // SVG Icons for bottom nav
    function HomeIcon({ active }) {
      return (
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={active ? '#FFFFFF' : '#8E8E93'} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 9.5L12 3L21 9.5V20C21 20.55 20.55 21 20 21H15V15H9V21H4C3.45 21 3 20.55 3 20V9.5Z"/>
        </svg>
      );
    }

    function StocksIcon({ active }) {
      return (
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={active ? '#FFFFFF' : '#8E8E93'} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M5 17L9 13L13 15L19 8"/>
          <circle cx="19" cy="8" r="1.5" fill={active ? '#FFFFFF' : '#8E8E93'} stroke="none"/>
        </svg>
      );
    }

    function AnalyticsIcon({ active }) {
      return (
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="12" width="4" height="9" rx="1" fill={active ? '#FFFFFF' : '#8E8E93'}/>
          <rect x="10" y="7" width="4" height="14" rx="1" fill={active ? '#FFFFFF' : '#8E8E93'}/>
          <rect x="17" y="3" width="4" height="18" rx="1" fill={active ? '#FFFFFF' : '#8E8E93'}/>
        </svg>
      );
    }

    function SettingsIcon({ active }) {
      return (
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={active ? '#FFFFFF' : '#8E8E93'} strokeWidth="1.8" strokeLinecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/>
        </svg>
      );
    }

    // Candlestick chart
    const candleData = [
      {open:91,  close:93,   high:94,   low:90,   up:true},
      {open:93,  close:92,   high:94.5, low:91.5, up:false},
      {open:92,  close:94,   high:95,   low:91,   up:true},
      {open:94,  close:93.5, high:95.5, low:93,   up:false},
      {open:93.5,close:95,   high:96,   low:93,   up:true},
      {open:95,  close:96,   high:97,   low:94.5, up:true},
      {open:96,  close:95,   high:96.5, low:94,   up:false},
      {open:95,  close:97,   high:98,   low:94.5, up:true},
      {open:97,  close:96.5, high:97.5, low:96,   up:false},
      {open:96.5,close:98,   high:99,   low:96,   up:true},
      {open:98,  close:97.5, high:98.5, low:97,   up:false},
      {open:97.5,close:98.5, high:99.5, low:97,   up:true},
      {open:98.5,close:98,   high:99,   low:97.5, up:false},
      {open:98,  close:99,   high:100,  low:97.5, up:true},
      {open:99,  close:98.5, high:99.5, low:98,   up:false},
    ];

    function CandlestickChart() {
      const svgWidth = 316;
      const svgHeight = 150;
      const padding = { top: 10, bottom: 10, left: 0, right: 0 };
      const chartWidth = svgWidth - padding.left - padding.right;
      const chartHeight = svgHeight - padding.top - padding.bottom;

      const allPrices = candleData.flatMap(c => [c.high, c.low]);
      const minPrice = Math.min(...allPrices) - 0.5;
      const maxPrice = Math.max(...allPrices) + 0.5;
      const priceRange = maxPrice - minPrice;

      const totalCandles = candleData.length;
      const candleWidth = chartWidth / totalCandles;
      const bodyWidth = candleWidth * 0.5;

      const toY = (price) => padding.top + ((maxPrice - price) / priceRange) * chartHeight;
      const toCenterX = (i) => padding.left + (i + 0.5) * candleWidth;

      // Grid lines
      const gridLines = [0.2, 0.4, 0.6, 0.8].map(pct => padding.top + pct * chartHeight);

      return (
        <svg width={svgWidth} height={svgHeight} viewBox={`0 0 ${svgWidth} ${svgHeight}`}>
          {/* Dashed grid lines */}
          {gridLines.map((y, i) => (
            <line
              key={i}
              x1={padding.left}
              y1={y}
              x2={svgWidth - padding.right}
              y2={y}
              stroke="rgba(255,255,255,0.06)"
              strokeWidth="1"
              strokeDasharray="4 4"
            />
          ))}
          {/* Candles */}
          {candleData.map((candle, i) => {
            const cx = toCenterX(i);
            const highY = toY(candle.high);
            const lowY = toY(candle.low);
            const openY = toY(candle.open);
            const closeY = toY(candle.close);
            const bodyTop = Math.min(openY, closeY);
            const bodyBottom = Math.max(openY, closeY);
            const bodyH = Math.max(bodyBottom - bodyTop, 1.5);
            const color = candle.up ? '#BFFF00' : '#FF453A';
            return (
              <g key={i}>
                {/* Wick */}
                <line
                  x1={cx} y1={highY}
                  x2={cx} y2={lowY}
                  stroke={color}
                  strokeWidth="1.5"
                />
                {/* Body */}
                <rect
                  x={cx - bodyWidth / 2}
                  y={bodyTop}
                  width={bodyWidth}
                  height={bodyH}
                  rx="2"
                  fill={color}
                />
              </g>
            );
          })}
        </svg>
      );
    }

    // Main App
    function App() {
      const [splashExiting, setSplashExiting] = useState(false);
      const [showDashboard, setShowDashboard] = useState(false);
      const [showHeader, setShowHeader] = useState(false);
      const [showTabs, setShowTabs] = useState(false);
      const [showCard1, setShowCard1] = useState(false);
      const [showCard2, setShowCard2] = useState(false);
      const [showCard3, setShowCard3] = useState(false);
      const [showTrendPill, setShowTrendPill] = useState(false);
      const [showInvestBtn, setShowInvestBtn] = useState(false);
      const [showBottomNav, setShowBottomNav] = useState(false);
      const [dashboardFading, setDashboardFading] = useState(false);
      const [showDetail, setShowDetail] = useState(false);
      const [chartDrawn, setChartDrawn] = useState(false);
      const [showIndicator, setShowIndicator] = useState(false);
      const [indicatorPos, setIndicatorPos] = useState(0);
      const [displayPrice, setDisplayPrice] = useState(96.11);
      const [showTimeframe, setShowTimeframe] = useState(false);
      const [showStats, setShowStats] = useState(false);
      const [showDetailInvest, setShowDetailInvest] = useState(false);

      const animFrameRef = useRef(null);
      const priceAnimRef = useRef(null);

      useEffect(() => {
        // Phase 1 → Phase 2 transition
        const t1 = setTimeout(() => setSplashExiting(true), 1000);
        const t2 = setTimeout(() => {
          setShowDashboard(true);
          setSplashExiting(false);
        }, 1500);

        // Dashboard element animations
        const t3 = setTimeout(() => setShowHeader(true), 1500);
        const t4 = setTimeout(() => setShowTabs(true), 2000);
        const t5 = setTimeout(() => setShowCard1(true), 3000);
        const t6 = setTimeout(() => setShowCard2(true), 3500);
        const t7 = setTimeout(() => setShowCard3(true), 4000);
        const t8 = setTimeout(() => setShowTrendPill(true), 4500);
        const t9 = setTimeout(() => setShowInvestBtn(true), 6000);
        const t10 = setTimeout(() => setShowBottomNav(true), 6500);

        // Phase 3: Detail view
        const t11 = setTimeout(() => {
          setDashboardFading(true);
        }, 8000);
        const t12 = setTimeout(() => {
          setShowDetail(true);
        }, 8500);
        const t13 = setTimeout(() => setChartDrawn(true), 10000);

        // Price indicator animation at t=11000ms
        const t14 = setTimeout(() => {
          setShowIndicator(true);
          const startTime = Date.now();
          const duration = 1500;
          const startPrice = 96.11;
          const endPrice = 98.34;
          const startPos = 0;
          const endPos = 85;

          function animateIndicator() {
            const elapsed = Date.now() - startTime;
            const raw = Math.min(elapsed / duration, 1);
            // Cubic ease-out
            const t = 1 - Math.pow(1 - raw, 3);

            const pos = startPos + (endPos - startPos) * t;
            const price = startPrice + (endPrice - startPrice) * raw;

            setIndicatorPos(pos);
            setDisplayPrice(Math.round(price * 100) / 100);

            if (raw < 1) {
              priceAnimRef.current = requestAnimationFrame(animateIndicator);
            }
          }
          priceAnimRef.current = requestAnimationFrame(animateIndicator);
        }, 11000);

        const t15 = setTimeout(() => setShowTimeframe(true), 12000);
        const t16 = setTimeout(() => setShowStats(true), 12000);
        const t17 = setTimeout(() => setShowDetailInvest(true), 13000);

        return () => {
          [t1,t2,t3,t4,t5,t6,t7,t8,t9,t10,t11,t12,t13,t14,t15,t16,t17].forEach(clearTimeout);
          if (priceAnimRef.current) cancelAnimationFrame(priceAnimRef.current);
        };
      }, []);

      const formattedPrice = displayPrice.toFixed(2);

      return (
        <div className="phone-frame">
          {/* === PHASE 1: SPLASH === */}
          {!showDetail && (
            <div className={`splash-screen${splashExiting ? ' exiting' : ''}`}
              style={{ display: showDashboard ? 'none' : 'flex' }}>
              <p className="splash-title">Easy for Beginners,&nbsp;Powerful for All</p>
              <div className="splash-buttons">
                <button className="btn-login">LOG IN</button>
                <button className="btn-create">CREATE ACCOUNT</button>
              </div>
            </div>
          )}

          {/* === PHASE 2: DASHBOARD === */}
          {showDashboard && (
            <div className={`dashboard-screen${dashboardFading ? ' hidden' : ''}`}>
              {/* Header */}
              <div className={`dashboard-header${showHeader ? ' visible' : ''}`}>
                <div className="header-greeting">
                  <small>Good morning,</small>
                  <strong>Genevieve!</strong>
                </div>
                <div className="avatar-circle">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="8" r="4" fill="rgba(255,255,255,0.7)"/>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="rgba(255,255,255,0.7)"/>
                  </svg>
                </div>
              </div>

              {/* Category Tabs */}
              <div className={`category-tabs${showTabs ? ' visible' : ''}`}>
                {['Company', 'Startups', 'Personal'].map((tab) => (
                  <button
                    key={tab}
                    className={`tab-pill ${tab === 'Company' ? 'active' : 'inactive'}`}
                  >
                    {tab}
                  </button>
                ))}
              </div>

              {/* Stock Cards */}
              <div className="cards-container">
                {/* Pfizer */}
                <div className={`stock-card${showCard1 ? ' visible' : ''}`}>
                  <div className="card-left">
                    <PfizerLogo />
                    <div className="company-info">
                      <div className="company-name">Pfizer Inc</div>
                      <div className="company-ticker">PFE</div>
                    </div>
                  </div>
                  <div className="card-right">
                    <div className="price">$28.46</div>
                    <div className="change-positive">+1.24%</div>
                  </div>
                </div>

                {/* Nike */}
                <div className={`stock-card${showCard2 ? ' visible' : ''}`}>
                  <div className="card-left">
                    <NikeLogo />
                    <div className="company-info">
                      <div className="company-name">Nike Inc Class B</div>
                      <div className="company-ticker">NKE</div>
                    </div>
                  </div>
                  <div className="card-right">
                    <div className="price">$94.82</div>
                    <div className="change-negative">-0.87%</div>
                  </div>
                </div>

                {/* Estée Lauder */}
                <div className={`stock-card${showCard3 ? ' visible' : ''}`}>
                  <span className={`trend-pill${showTrendPill ? ' visible' : ''}`}>In Trend</span>
                  <div className="card-left">
                    <EsteeLogo />
                    <div className="company-info">
                      <div className="company-name">Estée Lauder</div>
                      <div className="company-ticker">EL</div>
                    </div>
                  </div>
                  <div className="card-right">
                    <div className="price">$96.04</div>
                    <div className="change-positive">+2.31%</div>
                  </div>
                </div>
              </div>

              {/* LET'S INVEST button */}
              <div className={`invest-btn-wrap${showInvestBtn ? ' visible' : ''}`}>
                <button className="invest-btn">
                  <span className="invest-btn-text">LET'S INVEST</span>
                  <div className="invest-btn-arrow">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M5 12h14M13 6l6 6-6 6"/>
                    </svg>
                  </div>
                </button>
              </div>

              {/* Bottom Navigation */}
              <div className={`bottom-nav${showBottomNav ? ' visible' : ''}`}>
                <div className="nav-item">
                  <HomeIcon active={true} />
                  <span className="nav-label active">Home</span>
                </div>
                <div className="nav-item">
                  <StocksIcon active={false} />
                  <span className="nav-label inactive">Stocks</span>
                </div>
                <div className="nav-item">
                  <AnalyticsIcon active={false} />
                  <span className="nav-label inactive">Analytics</span>
                </div>
                <div className="nav-item">
                  <SettingsIcon active={false} />
                  <span className="nav-label inactive">Settings</span>
                </div>
              </div>
            </div>
          )}

          {/* === PHASE 3: DETAIL === */}
          <div className={`detail-screen${showDetail ? ' visible' : ''}`}>
            {/* Detail Header */}
            <div className="detail-header-card">
              <div className="detail-header-row">
                <EsteeLogo size={36} />
                <div className="detail-company-info">
                  <div className="detail-company-name">Estée Lauder</div>
                  <div className="detail-company-sub">EL · NYSE</div>
                </div>
                <div className="detail-trend-pill">In Trend</div>
              </div>
              <div className="detail-price-center">
                <div className="detail-price-large">${formattedPrice}</div>
                <div className="detail-price-change">+2.31% · +$2.23 today</div>
              </div>
            </div>

            {/* Detail Body */}
            <div className="detail-body">
              {/* Chart */}
              <div className="chart-container">
                <div className={`chart-clip-wrapper${chartDrawn ? ' drawn' : ''}`}>
                  <CandlestickChart />
                </div>
                {/* Price indicator line */}
                {showIndicator && (
                  <div
                    className="price-indicator-line"
                    style={{
                      left: `calc(12px + ${indicatorPos}%)`,
                    }}
                  >
                    <div className="price-indicator-dot" />
                  </div>
                )}
              </div>

              {/* Timeframe Selector */}
              <div className={`timeframe-wrap${showTimeframe ? ' visible' : ''}`}>
                <div className="timeframe-selector">
                  {['1D','1W','1M','3M','1Y','ALL'].map((tf) => (
                    <button
                      key={tf}
                      className={`tf-btn ${tf === '1D' ? 'active' : 'inactive'}`}
                    >
                      {tf}
                    </button>
                  ))}
                </div>
              </div>

              {/* Stats Row */}
              <div className={`stats-row${showStats ? ' visible' : ''}`}>
                {[
                  { label: 'Open', value: '$96.04' },
                  { label: 'High', value: '$99.40' },
                  { label: 'Low',  value: '$95.20' },
                  { label: 'Vol',  value: '3.2M'   },
                ].map((stat) => (
                  <div key={stat.label} className="stat-card">
                    <div className="stat-label">{stat.label}</div>
                    <div className="stat-value">{stat.value}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* INVEST IN COMPANY Button */}
            <div className={`detail-invest-wrap${showDetailInvest ? ' visible' : ''}`}>
              <button className="detail-invest-btn">INVEST IN COMPANY</button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
